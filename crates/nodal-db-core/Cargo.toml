[package]
name = "nodal-db-core"
version = "0.0.0"
edition = "2021"
license = "EUPL-1.2"
publish = false

[dependencies]
# arrow is reached through `duckdb::arrow` (risk R2): no independent arrow line.
duckdb = { workspace = true }
thiserror = { workspace = true }
xxhash-rust = { workspace = true }
unicode-normalization = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
flate2 = { workspace = true }
# serde / serde_norway are regular dependencies above, so the integration
# tests that deserialize fixtures (e.g. template_ir.rs) need no dev-dep copy.

# The pre-freeze benchmark gate (plan Part 5 deliverable 4): `cargo bench`.
# `test = false` is load-bearing — the gate builds a ~150 MB synthetic DB
# through the core write path (minutes of wall time), which must never run
# under `cargo test --workspace` (criterion's --test smoke mode included).
[[bench]]
name = "gate"
harness = false
test = false

# Focused long-tier write micro-bench (RESULTS.md alarm #1). No synthetic DB;
# drives `history::write_value` directly. `test = false` keeps it out of
# `cargo test --workspace` like the gate.
[[bench]]
name = "long_write"
harness = false
test = false

# History-free extract: size and read timings of a churned source, its
# compacted copy and its head extract (RESULTS.md "History-free extract").
# A few minutes; `-- --quick` for a smaller source.
[[bench]]
name = "extract"
harness = false
test = false

# Compaction size on a history-heavy long table (RESULTS.md "Compaction
# size"; compaction_growth_FINDINGS). About a minute; `-- --quick` for the
# 1 M-row test-fixture size.
[[bench]]
name = "compaction_size"
harness = false
test = false

# Pure canonicalization-pipeline bench (no DB): per-cell cost of
# `canon::canonicalize` on array- and long-tier shapes. Pure, but kept out of
# `cargo test --workspace` like the others (the 1 M-cell case is slow).
[[bench]]
name = "canon"
harness = false
test = false
