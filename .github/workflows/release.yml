name: Release

# A `v*` tag (e.g. v0.1.0) builds and tests the Python wheels, the sdist and
# the CLI binaries, publishes the wheels and the sdist to PyPI, and creates
# the GitHub Release with the wheels, the binaries and the tag's CHANGELOG.md
# section as its notes.
#
# Platforms: Linux x86_64 and macOS arm64.
# - Linux wheels are manylinux_2_28 (glibc >= 2.28: RHEL/Rocky/Alma 8,
#   Debian 10, Ubuntu 18.10 and later, i.e. typical HPC clusters). The
#   bundled DuckDB 2.0 needs a C++17 compiler; the manylinux_2_28 image's gcc
#   toolset builds it, which manylinux2014's (CentOS 7) is not verified for.
#   The Linux CLI binary is built in the same image, so it runs on the same
#   systems.
# - macOS: arm64, deployment target 11.0.
#
# Every build uses the Rust toolchain of the workspace's `rust-version`
# (RUST_TOOLCHAIN below; keep the two equal) and the committed Cargo.lock
# (`--locked`). Third-party actions are pinned by commit SHA (the version in
# the comment); .github/dependabot.yml proposes updates.
#
# PyPI uses trusted publishing (no token): the PyPI project `nodal-db` has a
# trusted publisher for owner nodal-tools, repository nodal-db, workflow
# release.yml, environment `pypi`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98"

jobs:
  # The tag must match the version every package carries, and CHANGELOG.md
  # must have a dated section for it (`## [0.1.0] - 2026-11-30`, not
  # "unreleased").
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$version" != "$cargo_version" ]; then
            echo "tag $TAG does not match the workspace version $cargo_version" >&2
            exit 1
          fi
          rust_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$rust_version" != "$RUST_TOOLCHAIN" ]; then
            echo "RUST_TOOLCHAIN $RUST_TOOLCHAIN differs from the workspace rust-version $rust_version" >&2
            exit 1
          fi
          heading=$(grep -E "^## \[$version\]" CHANGELOG.md || true)
          if [ -z "$heading" ]; then
            echo "CHANGELOG.md has no '## [$version]' section" >&2
            exit 1
          fi
          if ! printf '%s\n' "$heading" | grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$"; then
            echo "CHANGELOG.md section is not dated (found: $heading); set the release date" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  wheel-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/nodal-db-py
          target: x86_64
          manylinux: "2_28"
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          args: --release --locked --out ../../dist
          docker-options: -e NODAL_DB_GIT_COMMIT=${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-linux-x86_64
          path: dist/*.whl

  wheel-macos:
    needs: version
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      NODAL_DB_GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/nodal-db-py
          target: aarch64-apple-darwin
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          args: --release --locked --out ../../dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-macos-arm64
          path: dist/*.whl

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/nodal-db-py
          command: sdist
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          args: --out ../../dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdist
          path: dist/*.tar.gz

  # Each wheel installed into a clean venv and the skin's test suite run
  # against it (from the tests directory, so the installed package is what
  # is imported).
  test-wheels:
    needs: [wheel-linux, wheel-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wheel-linux-x86_64
          - os: macos-15
            artifact: wheel-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: install the wheel and run the skin tests
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl "pytest" "duckdb==2.0.0"
          cd crates/nodal-db-py/tests
          /tmp/venv/bin/python -m pytest -q

  # The sdist built from scratch into a wheel (pinned toolchain, locked
  # dependencies) and smoke-tested, so a source install works too.
  test-sdist:
    needs: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdist
          path: dist
      - name: build a wheel from the sdist alone and import it
        env:
          MATURIN_PEP517_ARGS: --locked
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.tar.gz
          cd /tmp
          /tmp/venv/bin/python -c "import nodal_db, tempfile, os; p = os.path.join(tempfile.mkdtemp(), 'x.duckdb'); nodal_db.init(p); print(nodal_db.open(p).head_commit())"

  cli-linux:
    needs: version
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      NODAL_DB_GIT_COMMIT: ${{ github.sha }}
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: build
        run: cargo build --release --locked -p nodal-db-cli
      - name: package
        run: |
          name="nodal-db-$VERSION-$TARGET"
          mkdir -p "$name" cli
          cp target/release/nodal-db LICENSE README.md CHANGELOG.md "$name"/
          "$name"/nodal-db --version
          tar czf "cli/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-linux-x86_64
          path: cli/*.tar.gz

  cli-macos:
    needs: version
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      NODAL_DB_GIT_COMMIT: ${{ github.sha }}
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: build
        run: cargo build --release --locked -p nodal-db-cli
      - name: package
        run: |
          name="nodal-db-$VERSION-$TARGET"
          mkdir -p "$name" cli
          cp target/release/nodal-db LICENSE README.md CHANGELOG.md "$name"/
          "$name"/nodal-db --version
          tar czf "cli/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-macos-arm64
          path: cli/*.tar.gz

  publish-pypi:
    needs: [test-wheels, test-sdist, cli-linux, cli-macos]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nodal-db/
    permissions:
      id-token: write   # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  github-release:
    needs: [version, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          merge-multiple: true
      - name: release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: checksums
        run: cd assets && sha256sum * > SHA256SUMS
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" assets/* \
            --title "nodal-db $VERSION" \
            --notes-file notes.md \
            --verify-tag
