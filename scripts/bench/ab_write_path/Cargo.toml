# Paired A/B write-path harness (appender_write_path_PLAN §8). Not a
# workspace member: build it once against each core under comparison and
# drive both binaries with ab.py. See ab.py for the procedure.
[package]
name = "ab_write_path"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: keeps it out of the repository workspace.
[workspace]

[dependencies]
# Points at this checkout's core. For the "old" arm, copy this directory
# into an extracted old tree (`git archive <rev>`) at the same relative
# place and build it there.
nodal-db-core = { path = "../../../crates/nodal-db-core" }
tempfile = "3.27.0"

[features]
default = ["lookup_const"]
# lookup_raw_100k runs the core's api::ENTITY_NAME_LOOKUP_SQL. An old arm
# whose core predates that const (before 2026-10-24) builds with
# --no-default-features and runs the cur_cls/cur_name statement instead.
lookup_const = []
# The save-path new arm (save_path_open_reduction plan §6.2): saves commit
# with `WriteOptions::expect_commit` instead of a pre-commit RO poll, and
# `growth_session` is available. Needs a core that has `expect_commit`.
save_api = []
