[package]
name = "nodal-db-core"
version = "0.0.0"
edition = "2021"
license = "EUPL-1.2"
publish = false

[dependencies]
# arrow is reached through `duckdb::arrow` (risk R2): no independent arrow line.
duckdb = { workspace = true }
thiserror = { workspace = true }
xxhash-rust = { workspace = true }
unicode-normalization = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
# The ladder cross-check test parses the machine-readable classification
# mirror (tests/fixtures/flextool_migration_classification.yaml) with the
# same serde stack the loader uses.
serde = { workspace = true }
serde_norway = { workspace = true }

# The pre-freeze benchmark gate (plan Part 5 deliverable 4): `cargo bench`.
# `test = false` is load-bearing — the gate builds a ~150 MB synthetic DB
# through the core write path (minutes of wall time), which must never run
# under `cargo test --workspace` (criterion's --test smoke mode included).
[[bench]]
name = "gate"
harness = false
test = false

# Focused long-tier write micro-bench (RESULTS.md alarm #1). No synthetic DB;
# drives `history::write_value` directly. `test = false` keeps it out of
# `cargo test --workspace` like the gate.
[[bench]]
name = "long_write"
harness = false
test = false
