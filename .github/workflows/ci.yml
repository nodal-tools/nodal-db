name: CI

on:
  push:
    branches: [main]
  pull_request:

# Don't pile up runs on a fast-moving branch: newer push cancels the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # duckdb-rs compiles bundled DuckDB from source (minutes); cache it.
      - uses: Swatinem/rust-cache@v2

      # The project venv (.venv, deps in dev-requirements.txt) is needed by
      # both halves: `cargo test` shells out to the conformance oracles via
      # .venv/bin/python (tests/python_oracle.rs), and the smoke suite runs
      # on its pinned DuckDB. Same setup as `just venv`.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: project venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -r dev-requirements.txt

      # Quick gate, half 1: Rust core. Matches `cargo test --workspace`
      # locally — slow `#[ignore]` tests stay out of this tier.
      - name: cargo test --workspace
        run: cargo test --workspace

      # Quick gate, half 2: schema smoke (expects 223/223), on the venv's
      # DuckDB pinned to the line the schema is verified on (2.0.0).
      - name: schema smoke test
        run: .venv/bin/python schema/smoke_test.py

      # The A/B perf gate's tool tests (stdlib unittest: statistics,
      # verdicts, exit codes, cache keys on a temp repository). No builds
      # and no benchmarks: the gate itself is local-only (ab_ratio_gates D3).
      - name: perf-gate tool tests
        run: python -m unittest discover -s scripts/bench/ab/tests
