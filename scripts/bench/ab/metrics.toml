# The perf gate's metrics (ab_ratio_gates_PLAN §2). A metric = one harness
# mode (`mode`, default: the metric id), a threshold class, the fixtures it
# runs on, the capabilities it needs (capabilities.toml), and its RESULT
# CHECK (`check`, required: the runner refuses a metric without one,
# critique M4). Every sample's fixed check runs in the harness; the arms'
# result digests must be equal (`digest_exclude` lists digest fields a
# metric may legitimately differ in). Gate metrics use only the public
# surface: api::*, the SQL read macros and tables, the nodal-db CLI.
#
# Thresholds apply to the upper bound of the median ratio's 95 % CI.
# Initial classes (D4 as amended by critique T1); recalibrated from the A/A
# runs (specs/ab_ratio_gates_FINDINGS.md).

# `layout_floor` (per metric): the largest |median - 1| of three salted
# quick A/A runs on the Ryzen 5900XT host (2026-10-25, load 3.6-5.6,
# governor powersave): the code-layout and fixture floor. A FAIL within it
# of T is labelled "FAIL (<= layout floor)" for human judgement; it still
# fails. Recalibrate with `just perf-gate HEAD HEAD --aa [--aa-salt K]`.

[settings]
# The pre-fixed sequential plan (gatelib.Plan; error rates: sim.py and
# specs/ab_ratio_gates_FINDINGS.md): cumulative pairs per look. A metric
# stops at the first decided look; only undecided ones get more pairs.
quick_looks = [6, 11, 21]
full_looks = [6, 11, 21]
# Extra margin under T for a PASS at the first look (a systematic A/A
# offset, from the A/A calibration); 0 = the exact order-statistic rule.
first_look_margin = 0.0

[classes]
# In-process reads and lookups on a warm connection, CPU-bound.
hot = 1.05
# Every whole-commit write (RW open, commit, close), CHECKPOINT cycles,
# deletes, imports, maintenance, and reads that include an open.
io = 1.10
# File sizes: 3 samples per arm, gate max(C) / min(B).
size = 1.02

# ------------------------------------------------------------- fixtures
# `build` = the harness subcommand (`<bin> <build> <path> [scale]`), run
# by each arm's own binary; `scaled` = built at the run's --quick/--full
# scale; `shared` = built once (by the candidate) and read by both arms.
# A fixture without `build` is the arm's own nodal-db CLI binary.

[fixture.base100k]
env = "NODAL_AB_BASE"
build = "build_100k"

[fixture.big]
env = "NODAL_AB_BIG"
build = "build_big"

[fixture.longbig]
env = "NODAL_AB_LONGBIG"
build = "build_longbig"

# The criterion gate's synthetic DB (full) or a tenth of it (quick).
[fixture.synth]
env = "NODAL_AB_SYNTH"
build = "build_synth"
scaled = true

# compaction_size.rs's history-heavy long table (raw SQL, like that bench).
[fixture.hheavy]
env = "NODAL_AB_HHEAVY"
build = "build_hheavy"
scaled = true

# extract.rs's churned source.
[fixture.xsrc]
env = "NODAL_AB_XSRC"
build = "build_xsrc"
scaled = true

# One dense-form Arrow-IPC container, read by both arms' importers.
[fixture.ipc]
env = "NODAL_AB_IPC"
build = "build_ipc_dense"
scaled = true
shared = true

# The arm's own `nodal-db` binary (built from the arm's root workspace).
[fixture.cli]
env = "NODAL_AB_CLI"

# ----------------------------------------------------------------- reads
# Synthetic-fixture reads (the criterion gate's point and bulk groups) on
# one warm RO connection, Arrow end to end. Point reads: 20 warm-up and
# 200 timed executions, the sample is the median per execution; bulk
# reads: 1 warm-up, the median of K (25 quick / 5-9 full; 5 for the model
# load). Scale-neutral ids: the scale is
# recorded per result (quick = a tenth of the criterion gate's sizes).

[metric.rd_point_scalar]
layout_floor = 0.025
class = "hot"
fixtures = ["synth"]
scaled = true
check = "every execution returns exactly 1 row; digest of value_kind, v_float"

[metric.rd_point_long]
layout_floor = 0.015
class = "hot"
fixtures = ["synth"]
scaled = true
check = "every execution returns exactly 1 row; digest of the cell"

[metric.rd_point_array_dense]
layout_floor = 0.015
class = "hot"
fixtures = ["synth"]
scaled = true
check = "every execution returns exactly 1 row; digest of the 8 760-value payload"
note = "read_parameter_dense filtered by entity and alternative (index scan)"

[metric.rd_point_array_by_id]
layout_floor = 0.015
class = "hot"
fixtures = ["synth"]
scaled = true
check = "every execution returns exactly 1 row; digest of the payload"

[metric.rd_scalars_loader]
layout_floor = 0.025
class = "hot"
fixtures = ["synth"]
scaled = true
check = "row count = the scalar entities (10^5 full); digest of the loader columns"

[metric.rd_dense]
layout_floor = 0.040
class = "hot"
fixtures = ["synth"]
scaled = true
# ~8 ms at quick scale, with the same two per-process speed modes as the
# long scan: A/A [0.85, 1.03], [0.92, 1.07], [0.76, 1.04]. Full only.
scales = ["full"]
check = "row count = the array entities (1 000 full, ~70 MB); digest of the payloads"

[metric.rd_model_load_long]
layout_floor = 0.020
class = "hot"
fixtures = ["synth"]
scaled = true
check = "row count = long entities x 8 760 (1.23 M full); digest of the logical columns"

[metric.rd_long_scan_17pct]
class = "hot"
fixtures = ["synth"]
scaled = true
# At quick scale the scan takes ~2.5 ms and each process lands in one of two
# speed modes (2.1-2.5 vs 3.8-4.5 ms: thread placement), so a pair's ratio
# is 0.5-2.0 and no N decides it (A/A 1: [0.75, 1.25] at 21 pairs). The
# model-load read covers the same rows at quick scale.
scales = ["full"]
check = "row count = long entities x 8 760 at ~17 % dead; digest of position, time, value"

# The point-read macros (fast_point_reads_PLAN §6): rendered reads of one
# or a few values through read_value / read_values, on one warm
# connection; 5 warm-ups, then the median of 60 (quick) / 40 (full)
# executions (25 / 15 for the 20-series read). The baseline needs the
# macros (capability read_value_macro), so against an older base they are
# SKIPPED. No layout floor yet (no A/A calibration).

[metric.rd_point_value_array]
class = "hot"
fixtures = ["synth"]
scaled = true
needs = ["read_value_macro"]
check = "every execution returns 8 760 rows; the digest equals read_parameter's for the same entity and alternative (read once, untimed)"

[metric.rd_point_value_scalar]
class = "hot"
fixtures = ["synth"]
scaled = true
needs = ["read_value_macro"]
check = "every execution returns 1 row (the empty array-key path); the digest equals read_parameter's"

[metric.rd_point_value_window]
class = "hot"
fixtures = ["synth"]
scaled = true
needs = ["read_value_macro"]
check = "every execution returns 6 rows (a 6-hour window of one series); digest of the rows"
note = "raw DuckDB connection with default settings (caching operators on), not the core's open: the dict-cache bug shape (read_parameter with the same filter raises on the full fixture)"

[metric.rd_values_20]
class = "hot"
fixtures = ["synth"]
scaled = true
needs = ["read_value_macro"]
check = "every execution returns 20 x 8 760 rows; the digest equals read_parameter's for the same 20 entities"

