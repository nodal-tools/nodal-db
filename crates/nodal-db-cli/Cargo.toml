[package]
name = "nodal-db-cli"
description = "The nodal-db command-line tool: create, import into and maintain nodal-db database files."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories = ["database", "command-line-utilities", "science"]
publish = false

[[bin]]
name = "nodal-db"
path = "src/main.rs"
# The skin library `nodal_db` documents under the same name; the CLI has no
# library docs to build.
doc = false

[dependencies]
nodal-db-core = { path = "../nodal-db-core", version = "0.1.0" }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
# Direct arrow for IPC only — pinned =60.2.0 to duckdb's re-export (the one-arrow rule;
# see the workspace Cargo.toml comment: duckdb bumps require a matched bump).
arrow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Results-path benchmark (scripts/bench/RESULTS_results_path.md): bulk result
# ingest (core API loop vs the Arrow-IPC `import` lane) + read paths at
# solver-output scale. Lives in this crate because the IPC lane drives the
# built `nodal-db` binary (CARGO_BIN_EXE_). `test = false` keeps it out of
# `cargo test --workspace`; with no phase argument it is a no-op, so a bare
# `cargo bench` does not start the ~30 min run. Run: `just bench-results`.
[[bench]]
name = "results_path"
harness = false
test = false
