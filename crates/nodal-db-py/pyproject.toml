[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "nodal-db"
description = "Thin Python skin over the nodal-db core: marshal Arrow in, call the one canonicalizer, translate errors out."
requires-python = ">=3.9"
license = { text = "EUPL-1.2" }
dynamic = ["version"]
# pyarrow is required at runtime by the Arrow bridge (arrow-pyarrow constructs
# pyarrow objects for results and reads any __arrow_c_stream__/__arrow_c_array__
# producer for inputs). >=16 guarantees the PyCapsule interface both ways.
dependencies = ["pyarrow>=16"]

[tool.maturin]
module-name = "nodal_db"
# pyo3/extension-module is a DEFAULT cargo feature of this crate (see
# Cargo.toml [lib]/[features] comments) — no feature override needed here.
