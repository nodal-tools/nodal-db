[workspace]
members = ["crates/*"]
resolver = "2"

# Strip symbols from dev/test binaries. The bundled DuckDB static lib carries
# heavy debuginfo, which bloats every DuckDB-linked test binary to ~GB and has
# repeatedly filled this (tight) disk. We don't need symbol-level backtraces for
# the conformance/spike tests; stripping keeps target/ sustainable.
[profile.dev]
strip = true

# Compile the bundled DuckDB optimized even in dev/test builds. libduckdb-sys
# builds DuckDB with DEBUG (D_ASSERT + debug-only verification paths, -O0)
# whenever the package has debug info; that made the test suite ~8x slower
# (api_delete_values: 14.8 s -> 1.8 s) and changes planner behaviour (debug
# DuckDB compresses every join key). Our own crates stay unoptimized.
[profile.dev.package.libduckdb-sys]
opt-level = 3
debug = false

# Versions are pinned once here and referenced from each crate via
# `workspace = true`. The de-risk spike (Phase 0) gates the duckdb-rs choice:
# its bundled DuckDB must be >= 2.0 (the line the schema is verified on;
# native 2.0 storage format, see crates/nodal-db-core/src/lib.rs).
# arrow is normally consumed only through `duckdb::arrow` so exactly one arrow
# major is ever in the tree (risk R2) — with ONE sanctioned exception, the
# direct pinned `arrow` line below (R2 partially re-opened; see its comment).
[workspace.dependencies]
# duckdb-rs versions its crate to encode the bundled DuckDB release in the
# MINOR number: 1.20000.0 bundles DuckDB 2.0.0, so DuckDB 2.0.1 will be
# 1.20001.0. The pin is EXACT (=) on purpose: `~1.20000.0` would exclude
# 2.0.1, and a caret would allow any 1.x. Every engine change is a deliberate,
# gate-tested matched bump that keeps the bundled engine in lockstep with the
# `duckdb==` pin in dev-requirements.txt / docs-requirements.txt. The bundled
# DuckDB must stay >= 2.0 (MINIMUM_DUCKDB in nodal-db-core).
# MATCHED-BUMP REQUIRED (three-way): any duckdb-rs bump that changes the
# re-exported arrow version REQUIRES bumping BOTH the `arrow` pin below AND
# the `arrow-pyarrow` pin (further below) to the identical version — and
# arrow-pyarrow's own pyo3 requirement then dictates the `pyo3` line.
duckdb = { version = "=1.20000.0", features = ["bundled"] }
# R2 partially re-opened (specs/arrow_ipc_bulk_format.md §2.4, critique F12):
# the `nodal-db import` boundary needs arrow's IPC reader/writer, which
# `duckdb::arrow` does NOT re-export (duckdb pulls arrow without the `ipc`
# feature). This direct dependency is pinned EXACTLY (=60.0.0) to the arrow
# version duckdb 1.20000.0 re-exports so cargo unifies both into ONE crate —
# type identity is proven at compile time in nodal-db-cli (an IPC-read
# RecordBatch crosses into the core's duckdb::arrow-typed API with no
# conversion). A duckdb-rs bump is therefore a version-locked, THREE-line
# affair: bump duckdb, bump this pin, and bump `arrow-pyarrow` below to the
# same version (which in turn dictates the `pyo3` line).
arrow = { version = "=60.0.0", default-features = false, features = ["ipc", "ipc_compression"] }
thiserror = "2.0.20"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
# NFC normalization. Pinned to =0.1.24 because that release's tables are
# Unicode 16.0.0 — the version spec §3.4.1.1 pins. (0.1.25 bumped to Unicode
# 17.0.0.) A version bump here is a rehash-class change (spec §2.4);
# crates/nodal-db-core/tests/text_nfc.rs fails when the tables move.
unicode-normalization = "=0.1.24"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Template IR (template_ir_plan.md D1: YAML 1.2 authoring surface). serde_norway
# is the maintained serde_yaml fork whose scalar resolution follows the YAML 1.2
# core schema in ALL contexts (only true/false are booleans — the Norway problem
# is closed even under deserialize_any/untagged enums, verified against
# serde-saphyr 1.3.0 which resolves yes/no/on/off as 1.1 booleans there). Its
# emitter quotes any scalar its own parser would misread ('69', 'true'), so
# emit->parse round-trips are self-consistent.
serde_norway = "0.9.42"
# The Python skin (crates/nodal-db-py; engine_portability_FINDINGS §7: the
# write-path SDK is bindings over the one core). arrow-pyarrow is the
# maintained Arrow <-> Python bridge split out of arrow-rs; it is pinned
# EXACTLY to the `arrow` pin above (same release train, same arrow-array in
# the tree — the R2 one-arrow-version rule extends to it).
# MATCHED-BUMP REQUIRED (three-way): a duckdb-rs bump that changes the
# re-exported arrow version requires bumping `arrow` AND `arrow-pyarrow` to
# the identical version — and arrow-pyarrow's own pyo3 requirement then
# dictates the `pyo3` line below (60.0.0 requires pyo3 ^0.29).
arrow-pyarrow = "=60.0.0"
# abi3-py311: one wheel per platform, CPython >= 3.11 — one Python floor
# across the skin, the dev venvs and the docs (the DuckDB 2.0 Python client
# needs 3.11+).
pyo3 = { version = "0.29.3", features = ["abi3-py311"] }
clap = { version = "4.6.6", features = ["derive"] }
anyhow = "1.0.104"
tempfile = "3.27.0"
# The pre-freeze benchmark gate (rust_implementation_plan.md Part 2 dev-only
# deps; Part 5 deliverable 4). Dev-only, never in a shipped artifact.
criterion = "0.5"
# Test-only: reads the gzipped official NormalizationTest
# (conformance/unicode/, tests/text_nfc.rs). Already in the tree as a
# build dependency of libduckdb-sys, so it adds no crate.
flate2 = "1.1.9"
